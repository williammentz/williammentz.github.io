---
layout: default
---

<div class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
  </header>

  <article>
    {% if page.cv_pdf %}
      <a
        class="float-right"
        href="{{ page.cv_pdf | prepend: site.baseurl }}"
        target="_blank"
        rel="noopener"
        aria-label="Download CV as PDF"
      >
        <i class="fas fa-file-pdf fa-2x"></i>
      </a>
    {% endif %}
    
    {{ content }}
  </article>
</div>
